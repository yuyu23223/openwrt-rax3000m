# XR30 NAND + NaiLink —— 一条 workflow 跑完
#
# job 1 runtime ：在 ubuntu-24.04 上按 NaiLink 官方 CI 的做法交叉编译
#                 daed / btf-probe / luci-proxy（arm64），打成 tar.gz 传 artifact
# job 2 firmware：下载上面的 artifact，装成 buildroot 包，编 XR30 NAND 固件
#
# 前提（README-fork.md §1）：
#   - 已 git rm .github/workflows/apk.yml（跨账号推送，fork 里必失败）
#   - Settings → Actions → General → Workflow permissions = Read and write
#   - 已完成 README-fork.md §2 的旧 DAED 清理
#
# 全程只用 GITHUB_TOKEN，不需要任何 secret。
# 未经实际编译验证：标 TODO 的地方需要你确认。

name: xr30-nand-nailink

on:
  workflow_dispatch:
    inputs:
      NAILINK_TAG:
        description: 'NaiLink release tag'
        required: true
        default: 'openwrt-v0.6.85'
      DAED_VERSION:
        description: 'NaiLink 版本号（纯 x.y.z，须与 tag 一致）'
        required: true
        default: '0.6.85'
      BUILD_RUNTIME:
        description: '是否重新编译 runtime（false 则用下方 URL）'
        required: true
        type: boolean
        default: true
      NAILINK_RUNTIME_URL:
        description: 'BUILD_RUNTIME=false 时必填：runtime 归档 URL'
        required: false
        default: ''
      NAILINK_RUNTIME_SHA256:
        description: 'BUILD_RUNTIME=false 时必填：该归档的 SHA256'
        required: false
        default: ''
      SOURCE_TAG:
        description: '固件源码 tag，留空取最新 v25.*'
        required: false
        default: ''
      OP_IP:
        description: 'Static IP address'
        required: false
        default: '192.168.2.1'
      BUILD_DATE:
        description: '固件发布日期，留空用当天'
        required: false
        default: ''

permissions:
  contents: write

env:
  DIY_P1_SH: sh/op.sh
  SOURCE_NAME: openwrt
  REPO_URL: https://github.com/shiyu1314/openwrt-source
  REPO_BRANCH: openwrt-25.12
  DEVICE: cmcc_xr30-nand
  # 与 NaiLink CI 对齐（.github/workflows/openwrt.yml）
  GO_VERSION: '1.26.0'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------- runtime
  runtime:
    if: inputs.BUILD_RUNTIME
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout NaiLink
      uses: actions/checkout@v6
      with:
        repository: slobys/NaiLink
        ref: ${{ inputs.NAILINK_TAG }}
        submodules: recursive
        path: nailink-src

    - name: Show NaiLink commit
      working-directory: nailink-src
      run: |
        git rev-parse HEAD | tee "$GITHUB_WORKSPACE/nailink-commit.txt"
        git submodule status --recursive | tee "$GITHUB_WORKSPACE/nailink-submodules.txt" || true
        head -60 openwrt/Makefile

    - uses: pnpm/action-setup@v6.0.9
      with:
        package_json_file: nailink-src/package.json

    - uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: pnpm
        cache-dependency-path: nailink-src/pnpm-lock.yaml

    - name: Build web frontend
      working-directory: nailink-src
      run: |
        pnpm install --frozen-lockfile
        pnpm build
        pnpm --dir apps/web build:openwrt
        test -s apps/web/dist-openwrt/index.html && echo "web ok"

    - uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: Install clang / llvm
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends clang llvm zstd file

    # 与 NaiLink CI 的 runtime job 同一条命令（arm64 不需要预取 SDK）
    - name: Build arm64 runtime
      working-directory: nailink-src
      env:
        GOOS: linux
        CGO_ENABLED: '0'
      run: |
        VERSION='${{ inputs.DAED_VERSION }}'
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::DAED_VERSION 必须是 x.y.z"; exit 1; }
        mkdir -p .build/runtime
        python3 openwrt/runtime.py --cpu arm64 --wing wing \
          --web apps/web/dist-openwrt --version "$VERSION" \
          --work /tmp/daed-runtime-sdk --output .build/runtime
        for b in daed btf-probe luci-proxy; do
          test -s ".build/runtime/$b" || { echo "::error::runtime 缺少 $b"; exit 1; }
          file ".build/runtime/$b"
        done

    - name: Package runtime
      working-directory: nailink-src
      run: |
        VERSION='${{ inputs.DAED_VERSION }}'
        OUT="$GITHUB_WORKSPACE/nailink-runtime-${VERSION}-arm64.tar.gz"
        tar -czf "$OUT" -C .build/runtime daed btf-probe luci-proxy
        ( cd "$GITHUB_WORKSPACE" && sha256sum "$(basename "$OUT")" | tee SHA256SUMS )
        tar -tzvf "$OUT"

    - uses: actions/upload-artifact@v4
      with:
        name: nailink-runtime-arm64
        path: |
          nailink-runtime-*.tar.gz
          SHA256SUMS
          nailink-commit.txt
          nailink-submodules.txt
        retention-days: 7

  # --------------------------------------------------------------- firmware
  firmware:
    needs: [runtime]
    if: always() && !cancelled() && (needs.runtime.result == 'success' || needs.runtime.result == 'skipped')
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout fork
      uses: actions/checkout@v6

    - name: Take runtime artifact
      if: needs.runtime.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: nailink-runtime-arm64
        path: .

    # 挡住两类事故：旧 DAED 没删干净 / 跨账号推送残留
    - name: Audit repository
      run: bash scripts/audit-repo.sh

    - name: Free disk space
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo swapoff -a
        sudo rm -f /swapfile /mnt/swapfile
        sudo docker image prune -a -f || true
        sudo systemctl stop docker || true
        sudo snap set system refresh.retain=2 || true
        sudo apt-get -y purge firefox clang* ghc* google* llvm* mono* mongo* mysql* php* || true
        sudo apt-get -y autoremove --purge || true
        sudo apt-get clean
        sudo rm -rf /etc/mysql /etc/php /usr/lib/jvm /usr/libexec/docker /usr/local /usr/src/* \
          /var/lib/docker /var/lib/gems /var/lib/mysql /var/lib/snapd /etc/skel \
          /opt/{microsoft,az,hostedtoolcache,cni,mssql-tools,pipx} \
          /usr/share/{az*,dotnet,swift,miniconda,gradle*,java,kotlinc,ri,sbt} \
          /root/{.sbt,.local,.npm}
        sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
        rm -rf ~/{.cargo,.dotnet,.rustup}
        df -Th

    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y tar build-essential flex bison cmake g++ gawk gcc-multilib \
          g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip \
          python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget \
          subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 \
          libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev \
          libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev \
          rename qemu-utils clang llvm
        sudo apt-get clean
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        sudo timedatectl set-timezone 'Asia/Shanghai'
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        df -Th

    - name: Set variables
      run: |
        TAG="${{ inputs.BUILD_DATE }}"
        [ -n "$TAG" ] || TAG="$(date +'%Y%m%d')"
        {
          echo "tag=$TAG"
          echo "OP_IP=${{ inputs.OP_IP }}"
          echo "NAILINK_TAG=${{ inputs.NAILINK_TAG }}"
          echo "DAED_VERSION=${{ inputs.DAED_VERSION }}"
        } >> "$GITHUB_ENV"

        if [ "${{ needs.runtime.result }}" = "success" ]; then
          TGZ="$(ls nailink-runtime-*.tar.gz | head -1)"
          echo "NAILINK_RUNTIME_TGZ=$GITHUB_WORKSPACE/$TGZ" >> "$GITHUB_ENV"
          echo "NAILINK_RUNTIME_SHA256=$(awk 'NR==1{print $1}' SHA256SUMS)" >> "$GITHUB_ENV"
          echo "NaiLink commit: $(cat nailink-commit.txt)"
        else
          echo "NAILINK_RUNTIME_URL=${{ inputs.NAILINK_RUNTIME_URL }}" >> "$GITHUB_ENV"
          echo "NAILINK_RUNTIME_SHA256=${{ inputs.NAILINK_RUNTIME_SHA256 }}" >> "$GITHUB_ENV"
        fi

    - name: Clone source
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone "$REPO_URL" "$SOURCE_NAME"
        ln -sf "/workdir/$SOURCE_NAME" "$GITHUB_WORKSPACE/$SOURCE_NAME"

    # 方案文档 §4：固定源码版本，不跟 main
    - name: Checkout source tag
      run: |
        cd "$SOURCE_NAME"
        if [ -n "${{ inputs.SOURCE_TAG }}" ]; then
          _release_tag="${{ inputs.SOURCE_TAG }}"
        else
          _release_tag="$(git tag --sort=taggerdate --list 'v25.*' | tail -1)"
        fi
        echo "::notice::firmware source tag = $_release_tag"
        git checkout "$_release_tag"
        {
          echo "release_tag=$_release_tag"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
        } >> "$GITHUB_ENV"

    - name: Restore build cache
      uses: actions/cache/restore@v5
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir
          openwrt/build_dir/host
          openwrt/build_dir/hostpkg
          openwrt/build_dir/toolchain-*
          openwrt/bin/packages
          openwrt/bin/targets
        key: openwrt-${{ env.DEVICE }}-build-cache-${{ github.run_id }}
        restore-keys: |
          openwrt-${{ env.DEVICE }}-build-cache-
          openwrt-xr30-nand-build-cache-

    - name: Validate toolchain cache
      run: |
        cd "$SOURCE_NAME"
        if [ -d staging_dir ] && ! find staging_dir -path '*/toolchain-*/lib/libgcc_s.so.*' | grep -q .; then
          echo "::warning::Restored toolchain cache is incomplete; rebuilding toolchain only."
          rm -rf staging_dir/toolchain-* build_dir/toolchain-* build_dir/target-*/toolchain
          rm -f staging_dir/target-*/pkginfo/toolchain.* staging_dir/target-*/stamp/.toolchain_installed
        fi
        rm -rf dl/go-mod-cache

    - name: Prepare feeds and patches
      run: |
        set -x
        cd "$SOURCE_NAME"
        [ -d ./staging_dir ] && find ./staging_dir/ -name '*' -exec touch {} \; >/dev/null 2>&1 || true
        ./scripts/feeds update -a
        cd "$GITHUB_WORKSPACE"
        [ -e patch ] && cp -rf patch/diy/*.patch "$SOURCE_NAME"
        [ -e patch ] && cp -rf patch/luci/*.patch "$SOURCE_NAME/feeds/luci"

    # sh/op.sh 已在 fork 中清掉旧 DAED 段（README-fork.md §2）
    - name: Run custom script
      run: |
        cd "$SOURCE_NAME"
        chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
        "$GITHUB_WORKSPACE/$DIY_P1_SH"
        cd "$GITHUB_WORKSPACE"
        [ -e patch ] && cp -rf patch/nginx/luci.locations "$SOURCE_NAME/feeds/packages/net/nginx/files-luci-support"
        [ -e patch ] && cp -rf patch/nginx/uci.conf.template "$SOURCE_NAME/feeds/packages/net/nginx-util/files"

    - name: Integrate NaiLink
      run: |
        bash scripts/nailink-integrate.sh
        echo "--- 冲突与依赖声明 ---"
        grep -nE 'CONFLICTS|^  DEPENDS|PKG_VERSION' "$SOURCE_NAME/package/nailink/official.mk" || true

    - name: Load XR30 NAND config
      run: |
        [ -e files ] && mv files "$SOURCE_NAME/files"
        rm -f "$SOURCE_NAME/files/etc/uci-defaults/99-daed-geodata"

        cat <<EOF >>"$SOURCE_NAME/.config"
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y
        EOF

        [ -e config ] && cat config/config-common >> "$SOURCE_NAME/.config"

        # NaiLink 选择项（包名来自官方 openwrt/Makefile）
        cat <<EOF >>"$SOURCE_NAME/.config"
        CONFIG_PACKAGE_daed-router=y
        CONFIG_PACKAGE_luci-app-daed-router=y
        CONFIG_PACKAGE_v2ray-geosite=y
        EOF

        sed -i "s/192.168.1.1/$OP_IP/" "$SOURCE_NAME/package/base-files/files/bin/config_generate"

    - name: Audit .config
      run: bash scripts/audit-config.sh

    - name: Download package sources
      run: |
        cd "$SOURCE_NAME"
        make defconfig
        bash "$GITHUB_WORKSPACE/scripts/audit-config.sh" --post-defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \; || true
        find dl -size -1024c -exec rm -f {} \; || true

    - name: Compile firmware
      run: |
        cd "$SOURCE_NAME"
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || yes n | make -j1 || yes n | make -j1 V=s

    - name: Clean volatile Go module cache
      if: always()
      run: rm -rf "$SOURCE_NAME/dl/go-mod-cache"

    - name: Save build cache
      if: always()
      uses: actions/cache/save@v5
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir
          openwrt/build_dir/host
          openwrt/build_dir/hostpkg
          openwrt/build_dir/toolchain-*
          openwrt/bin/packages
          openwrt/bin/targets
        key: openwrt-${{ env.DEVICE }}-build-cache-${{ github.run_id }}

    # 方案文档 §7.2 / §7.3：包清单 + 架构 + 空间
    - name: Audit image
      run: bash scripts/audit-image.sh

    - name: Organize firmware
      id: organize
      run: |
        cp "$SOURCE_NAME"/.config /tmp/build.config
        cd "$SOURCE_NAME"/bin/targets/*/*/
        ls -la
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: xr30-nand-nailink-${{ env.release_tag }}-${{ env.tag }}
        path: |
          openwrt/bin/targets/*/*/*.bin
          openwrt/bin/targets/*/*/*.manifest
          /tmp/build.config
        if-no-files-found: warn
        retention-days: 14

    - name: Upload firmware to Releases
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.release_tag }}-${{ env.tag }}-xr30-nand-nailink
        files: ${{ env.FIRMWARE }}/*
        body: |
          ==================== Firmware Info =======================
          Workflow: xr30-nand-nailink
          Device: XR30 NAND (${{ env.DEVICE }})
          Firmware source: ${{ env.REPO_URL }} @ ${{ env.release_tag }}
          Firmware commit: ${{ env.SOURCE_COMMIT }}
          NaiLink: ${{ env.NAILINK_TAG }} (DAED_VERSION=${{ env.DAED_VERSION }})
          Runtime sha256: ${{ env.NAILINK_RUNTIME_SHA256 }}
          Static IP: ${{ inputs.OP_IP }}
          Built by: ${{ github.repository }} run ${{ github.run_id }}
